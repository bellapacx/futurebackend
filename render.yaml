services:
  - type: web
    name: futures-api
    runtime: python
    rootDir: backend
    buildCommand: |
      pip install -r requirements.txt
      cd pyne && pip install -e ".[pro]"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: DATABENTO_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
